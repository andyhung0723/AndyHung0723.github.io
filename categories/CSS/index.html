fsettop ; var offsetheight = stickytables[i]. offsetheight - thead. offsetheight ; var transformy = gettranslatey (thead); if (scrolltop &gt;= offsettop &amp;&amp; scrolltop &lt;= offsettop + offsetheight) &amp;#123; transformy = scrolltop - offsettop; &amp;#125; else if (scrolltop &lt; offsettop)&amp;#123; transformy = 0 ; &amp;#125; thead. style . transform = &amp;#x27;translatey(&amp;#x27; + transformy + &amp;#x27;px)&amp;#x27; ; &amp;#125; &amp;#125;); function gettranslatey ( element ) &amp;#123; var style = window . getcomputedstyle (element); var matrix = new webkitcssmatrix (style. transform ); return matrix. m42 ; &amp;#125;"><div class="entry-meta"><time datetime="2022-06-08">2022.06.08</time><span class="pill note">研究筆記</span></div><div><h3><a href="/2022/06/08/position-sticky-issue/">position:sticky 遇到 overflow 時失效解法</a></h3><p>今天在處理將 table 表頭凍結在最上方時，找到了使用 position: sticky 的方式解決，但若我要同時在小畫面時讓這個 table 的 X 軸能夠有 scroll bar 卻出現了問題，以下紀錄一下問題原因與解決方式。</p><div class="byline">Andy Hung · 4 分鐘閱讀</div></div><a class="entry-arrow" tabindex="-1" aria-hidden="true" href="/2022/06/08/position-sticky-issue/">↗</a></article>
