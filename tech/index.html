變更重點github 宣布，自 2026&amp;#x2f;12&amp;#x2f;02 起，公開 repository 的 pull_request_target 事件預設遭封鎖，除非適用的 actions event policy 明確允許。private、internal repository 與 github enterprise server 不在本次適用範圍。
原因是此事件使用 base repository 的執行環境，可存取其 secrets；若執行來自 fork 的不可信程式碼，可能暴露憑證。
時間與準備官方排定兩次短暫強制測試，換算台灣時間為 11&amp;#x2f;10、11&amp;#x2f;17 的 00:00–02:00。截至本篇複核，第一次窗口已過，第二次仍待到來。
建議先搜尋 workflow 的觸發事件，透過 insights 確認預計遭阻擋的執行。若確實需要保留此事件，應審查不可信輸入及 secret 權限，並將允許政策限縮至必要 workflow，而非一律放行。
適用判斷： 沒有使用此事件的專案，不應僅因這份公告而更動流程。
官方來源
github changelog：pull_request_target blocked by default december 2（2026&amp;#x2f;11&amp;#x2f;02）
