ar-2026-11-09/">↗</a></article>
<article class="entry" data-search="資安週報精選｜apt 套件驗證漏洞與修補 本期聚焦 apt 的高風險漏洞：適用條件、版本確認，以及修補前應注意的下載路徑。 資安週報 本篇節選自 2026/11/02–11/08 的資安週報，於 11/13 重新核對官方來源。這是公開資訊精選，不是完整漏洞清單，也不表示讀者的系統已受影響。 本週先看：apt 安全更新 canonical 於 11/4 公告 cve-2026-109518 。能操縱套件下載 http 流量的攻擊者，在重試下載等條件成立時，可能使 apt 安裝惡意套件並取得 root 權限。官方評為 high，cvss 4.0 為 7.7。 ubuntu 22.04 lts 及更新版本在預設設定下受影響；較舊版本則須檢查 acquire::retries 是否非零。公告提供修補，但不能據此認定所有系統已完成更新。 建議檢查順序 確認作業系統、apt 版本及套件來源。 對照官方修補表；例如 ubuntu 22.04 的修補版本為 2.4.15ubuntu0.1 。 依維護流程安裝更新，再確認實際安裝結果。https 可降低此下載路徑攻擊風險，但不應取代修補。 證據邊界： 本篇未確認野外利用狀態，也未檢查任何個別主機。 官方來源 canonical：apt vulnerability fixes available（2026/11/04） 公開版僅保留可核實的通用資訊；不包含原報告中的個別環境設定。"><div class="entry-meta"><time datetime="2026-11-09">2026.11.09</time><span class="pill security">資安週報</span></div><div><h3><a href="/2026/11/09/security-weekly-2026-11-09/">資安週報精選｜APT 套件驗證漏洞與修補</a></h3><p>本期聚焦 APT 的高風險漏洞：適用條件、版本確認，以及修補前應注意的下載路徑。</p><div class="byline">AI 協助整理 · 2 分鐘閱讀</div></div><a class="entry-arrow" tabindex="-1" aria-hidden="true" href="/2026/11/09/security-weekly-2026-11-09/">↗</a></article>
